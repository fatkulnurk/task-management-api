name: taskmanagement

services:
  mysql:
    image: mysql:9.7.2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskmanagement}
      MYSQL_USER: ${MYSQL_USER:-taskmanagement}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taskmanagement}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-44002}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  migrate:
    image: migrate/migrate:v4.18.3
    restart: "no"
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database
      - mysql://${MYSQL_USER:-taskmanagement}:${MYSQL_PASSWORD:-taskmanagement}@tcp(mysql:3306)/${MYSQL_DATABASE:-taskmanagement}?multiStatements=true
      - up
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    ports:
      - "127.0.0.1:${API_PORT:-44001}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
