name: taskmanagement

services:
  mysql:
    image: mysql:9.7.2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskmanagement}
      MYSQL_USER: ${MYSQL_USER:-taskmanagement}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taskmanagement}
    ports:
      - "${MYSQL_PORT:-44002}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations/001_create_users.up.sql:/docker-entrypoint-initdb.d/001_create_users.sql:ro
      - ./migrations/002_create_refresh_tokens.up.sql:/docker-entrypoint-initdb.d/002_create_refresh_tokens.sql:ro
      - ./migrations/003_create_teams.up.sql:/docker-entrypoint-initdb.d/003_create_teams.sql:ro
      - ./migrations/004_create_team_members.up.sql:/docker-entrypoint-initdb.d/004_create_team_members.sql:ro
      - ./migrations/005_create_tasks.up.sql:/docker-entrypoint-initdb.d/005_create_tasks.sql:ro
      - ./migrations/006_create_task_logs.up.sql:/docker-entrypoint-initdb.d/006_create_task_logs.sql:ro
      - ./migrations/007_create_idempotency_keys.up.sql:/docker-entrypoint-initdb.d/007_create_idempotency_keys.sql:ro
      - ./migrations/008_seed_data.up.sql:/docker-entrypoint-initdb.d/008_seed_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ADDR: ":8080"
      DATABASE_URL: "${MYSQL_USER:-taskmanagement}:${MYSQL_PASSWORD:-taskmanagement}@tcp(mysql:3306)/${MYSQL_DATABASE:-taskmanagement}?parseTime=true"
      JWT_SECRET: ${JWT_SECRET:-replace-me-with-a-random-secret-hehehe-dont-forget}
    ports:
      - "${API_PORT:-44001}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
